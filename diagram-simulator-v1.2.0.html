<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagram Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f1f1; --card:#fafafa; --hl:#f1f1f1; --ink:#000; --sub:#737373; --mut:#8a8a8a;
  --green:#7ed957; --orange:#ffbd59; --blue:#38b6ff; --blue2:#37a2e9; --gray:#737373; --red:#ff5757;
  --line:#cb6ce6;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --en:"Futura","Jost","Century Gothic",sans-serif;
  --row:101px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:500 14px/1.5 var(--jp);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.en{font-family:var(--en)}
:focus-visible{outline:3px solid rgba(56,182,255,.55);outline-offset:2px;border-radius:8px}

/* ===== layout ===== */
#app{position:fixed;inset:0;display:grid;grid-template-rows:104px minmax(0,1fr);grid-template-columns:minmax(0,1fr) 514px;column-gap:2px}
#hd{grid-column:1/3;position:relative;display:flex;align-items:flex-start;min-width:0}
#lp{grid-row:2;grid-column:1;overflow:auto;position:relative;overscroll-behavior:contain}
#rp{grid-row:2;grid-column:2;background:var(--card);border-radius:24px 0 0 0;overflow:auto;position:relative;overscroll-behavior:contain}

/* 時間帯・途中での種別変更・出庫設定 */
.band{background:#f6f6f6;border-radius:14px;padding:8px 10px;margin-bottom:8px;display:grid;gap:6px}
.band .bt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:700 14px var(--jp);color:var(--sub)}
.band .bt>.in{flex:1;min-width:120px;font-size:17px;min-height:44px}
.band label{display:flex;align-items:center;gap:6px}
.band label .in{width:110px;font-size:17px;min-height:44px}
.tg2{background:#dff2d6;color:#3d8f1f;border-radius:8px;padding:2px 8px;font:700 12px var(--jp)}
.chg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font:700 14px var(--jp);color:var(--sub);background:#f6f6f6;border-radius:12px;padding:6px 8px}
.chg .in{flex:1;min-width:120px;min-height:42px}
.deps{display:grid;gap:5px;margin-top:6px}
.deps .cpy small{color:var(--sub);min-width:16px}
.deps .pill{padding:6px 10px}
.in{min-height:42px}
input.in[type=number]{min-width:84px}
.errb{background:#fff1f1;border:2px solid #ffd0d0;border-radius:16px;padding:12px 16px;margin:0 0 12px;animation:vin .22s ease}
.errb.top{margin:14px 28px 0}
.errb b{color:var(--red);font:700 16px var(--jp)}
.errb p{margin:4px 0 10px;font:600 14px/1.6 var(--jp);color:#444}
.depr{display:flex;align-items:center;gap:12px;padding:8px 0}
.depr b{font:700 17px var(--jp)}
@media (max-width:1100px){#app{grid-template-columns:minmax(0,1fr) 440px}}
#bigdia{grid-row:2;grid-column:1;z-index:6;background:var(--bg);overflow:auto;padding:0 16px 24px;animation:vin .2s ease}
#bigdia .bh{position:sticky;top:0;left:0;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 0;background:var(--bg)}
#bigdia .bh b{font:700 24px/1.2 var(--jp);flex:1}

/* ===== header ===== */
.hline{position:relative;width:392px;height:104px;flex:none}
.hline .sw{position:absolute;top:10px;left:0;display:flex;align-items:center;gap:12px;height:28px;width:368px}
.tri{width:20px;height:20px;color:var(--sub);display:grid;place-items:center;transition:transform .15s}
.tri:hover{transform:scale(1.15)}
.tri.r{position:absolute;right:0;top:4px}
.badges{display:flex;gap:12px;align-items:center;min-width:0;overflow:hidden}
.lmk{display:inline-grid;place-items:center;flex:none;font-family:var(--en);font-weight:700;line-height:1;transition:transform .15s,box-shadow .2s}
button.lmk:hover{transform:translateY(-2px)}
.hname{position:absolute;left:18px;top:44px;display:flex;align-items:center;gap:12px;cursor:pointer}
.hname .t{display:flex;flex-direction:column}
.hname b{font:700 27px/1.15 var(--jp);letter-spacing:.02em;white-space:nowrap}
.hname small{font:500 15px/1.2 var(--jp);white-space:nowrap;margin-top:1px}
.gearb{position:absolute;left:333px;top:41px;display:flex;flex-direction:column;align-items:center;width:44px}
.gearb .c{width:44px;height:44px}
.gearb span{font:700 9.5px/1 var(--jp);color:var(--sub);margin-top:5px;white-space:nowrap}
.legend{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,23px);column-gap:13px;margin:10px 0 0 13px;flex:none;align-content:start}
.legend button{display:flex;align-items:center;gap:6px;font:700 14px/1 var(--jp);white-space:nowrap;transition:opacity .15s}
.legend button:hover{opacity:.7}
.legend i{width:18px;height:18px;border-radius:50%;flex:none}
.hctl{display:flex;gap:12px;margin:13px 0 0 auto;flex:none}
.cb{display:flex;flex-direction:column;align-items:center;width:58px}
.cb .c{width:58px;height:58px}
.cb span{font:700 10.5px/1 var(--jp);margin-top:7px;white-space:nowrap}
.c{border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .15s,filter .15s,box-shadow .2s}
button:hover>.c,button.c:hover{transform:scale(1.06)}
button:active>.c,button.c:active{transform:scale(.94)}
.c svg{display:block}
.spin svg{animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.clock{margin:15px 0 0 14px;flex:none;color:var(--sub)}
.clock small{display:block;font:700 13.5px/1 var(--jp);margin-top:4px}
.clock b{display:block;font:700 35px/1 var(--en);margin-top:9px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.daych{margin-left:6px;font:700 11px/1 var(--jp);color:#fff;background:#000;border-radius:999px;padding:3px 9px;vertical-align:1px;transition:transform .15s}
.daych:hover{transform:scale(1.06)}
.dayt{display:inline-block;font:700 10px/1.5 var(--jp);border-radius:999px;padding:0 6px;margin-left:4px;background:#e6e6e6;color:#555}
.stat{margin:13px 0 0 18px;flex:none;display:grid;row-gap:2px}
.stat div{display:flex;align-items:center;gap:6px;font:700 11px/14.5px var(--jp);white-space:nowrap}
.stat i{width:14px;height:14px;border-radius:50%;flex:none}
.ok{color:#4fb82a}.ok i{background:var(--green)}
.ng{color:var(--red)}.ng i{background:var(--red)}
.menu{margin:10px 13px 0 34px;flex:none}
.menu .c{width:64px;height:64px;background:#000}

/* ===== strip (left) ===== */
#strip{position:relative;min-width:830px}
#trk{position:absolute;left:0;top:0;pointer-events:none}
.srow{position:absolute;left:400px;height:var(--row);display:flex;align-items:center;gap:15px;padding:0 14px 0 8px;border-radius:52px;cursor:pointer;transition:background .2s}
.srow:hover{background:rgba(0,0,0,.035)}
.srow.sel{background:rgba(0,0,0,.065)}
.srow .nm{display:flex;flex-direction:column;justify-content:center;min-width:0}
.srow .nm b{font:700 42px/1.05 var(--jp);white-space:nowrap;display:flex;align-items:center;gap:10px}
.srow .nm small{font:500 18px/1.2 var(--jp);margin-top:2px;white-space:nowrap}
.srow .sub{display:flex;gap:5px}
.smk{display:inline-grid;place-items:center;align-content:center;font-family:var(--en);font-weight:700;line-height:.95;text-align:center;flex:none;background:#fff}
#rows .empty{position:absolute;left:40px;top:60px;max-width:520px;color:#8a8a8a}
#rows .empty b{display:block;font:700 28px/1.3 var(--jp);color:#6d6d6d}
#rows .empty p{font:500 15px/1.7 var(--jp);margin:8px 0 0}
#trains{position:absolute;left:0;top:0;width:400px;height:100%;pointer-events:none}
.tr{position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;pointer-events:auto;cursor:pointer;color:#fff;display:grid;place-items:center;will-change:transform;transition:box-shadow .2s, opacity .25s}
.tr .ti{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tr .n{font:700 17px/1 var(--en);height:17px}
.tr svg{display:block}
.tr.sel{box-shadow:0 0 0 4px #fff,0 0 0 8px #000}
.tr.late::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--red);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.tr.blk{filter:saturate(.55) brightness(.92)}

/* ===== right panel ===== */
.view{padding:14px 28px 40px;animation:vin .22s ease}
@keyframes vin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:center;gap:14px;min-height:72px}
.vh .t{display:flex;flex-direction:column;min-width:0;flex:1}
.vh .t b{font:700 34px/1.1 var(--jp)}
.vh .t small{font:500 18px/1.2 var(--jp)}
.x{width:40px;height:40px;background:#e4e4e4;color:#555;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .15s,background .15s}
.x:hover{background:#d8d8d8;transform:rotate(90deg)}
h2{font:700 30px/1.3 var(--jp);margin:38px 0 16px}
h3{font:700 20px/1.3 var(--jp);margin:26px 0 10px}
.note{color:var(--mut);font:500 12.5px/1.6 var(--jp);margin:4px 0}
.pf{border-radius:22px;padding:9px 12px;margin:0 -12px 4px;transition:background .2s}
.pf.open{background:var(--hl)}
.pfh{display:flex;align-items:center;gap:13px;cursor:pointer;min-height:42px;width:100%;text-align:left}
.num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 22px/1 var(--en);flex:none}
.pfh b{font:700 22px/1.2 var(--jp);flex:1;min-width:0}
.pfg{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:4px;align-items:start}
.pfl{padding-left:53px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pfr1{display:flex;gap:14px;align-items:flex-start;padding-top:2px}
.pfr2{display:flex;justify-content:flex-start;padding-top:4px}
.chip{display:flex;align-items:center;gap:6px;font:700 14px/1.3 var(--jp);text-align:left}
.chip i{width:20px;height:20px;border-radius:50%;flex:none}
.chip .tg{font:700 10.5px/1 var(--jp);color:#fff;background:#bbb;border-radius:9px;padding:3px 6px}
.chip .rm{color:#aaa;font-size:13px;margin-left:2px;opacity:0;transition:opacity .15s}
.chip:hover .rm{opacity:1}
.add{display:flex;align-items:center;gap:8px;color:#5e5e5e;font:700 14px/1.3 var(--jp);text-align:left}
.add i{width:20px;height:20px;border-radius:50%;background:#5e5e5e;color:#fff;display:grid;place-items:center;font:700 15px/1 var(--en);flex:none}
.add.lg{font-size:19px;gap:14px;margin:16px 0 0 4px}.add.lg i{width:28px;height:28px;font-size:20px}
.add.xl{font-size:29px;gap:16px;margin:40px 0 0 0;color:#6d6d6d}.add.xl i{width:42px;height:42px;font-size:29px;background:#6d6d6d}
.dw{display:flex;align-items:center;gap:7px;color:var(--blue);text-align:left}
.dw b{font:700 31px/1 var(--en);min-width:38px}
.dw input{width:96px;font:700 26px/1 var(--en);color:var(--blue);border:2px solid #cfe3f7;border-radius:10px;padding:4px 8px;background:#fff;transition:border-color .15s}
.dw input:focus{border-color:var(--blue);outline:0}
.dw input::placeholder{color:#9cc6ec}
.dw .ex{font:700 13px/1 var(--en);background:var(--orange);color:#fff;border-radius:9px;padding:3px 6px;margin-left:-2px}
.wt{color:var(--blue);font:700 14px/1.25 var(--jp);max-width:130px}
.tb{display:flex;align-items:center;gap:8px;color:#4fb82a;font:700 11px/1.3 var(--jp);text-align:left}
.tb .c{width:44px;height:44px;background:var(--green)}
.tb.off{color:var(--red)}.tb.off .c{background:var(--red)}
.pfx{grid-column:1/3;display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font:700 14px/1.6 var(--jp);color:var(--sub);align-items:center}
.pfx button,.lk{color:var(--sub);text-decoration:underline;text-decoration-color:#c8c8c8;text-underline-offset:3px;font:700 13px/1.6 var(--jp)}
.pfx button:hover,.lk:hover{color:#000}
.pfx select{font:700 15px/1.4 var(--jp);border:2px solid #dcdcdc;background:#fff;border-radius:10px;padding:6px 10px;color:#333;min-height:40px}
.pfx .in{width:190px;min-height:40px}
.pfx label{display:flex;align-items:center;gap:4px}
.pfx input[type=number]{width:100px;font:700 16px var(--en);border:2px solid #dcdcdc;background:#fff;border-radius:10px;padding:6px 10px;min-height:40px}
.lst{display:flex;flex-direction:column;gap:2px}

/* generic form */
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font:700 11.5px/1.2 var(--jp);color:var(--sub)}
.in{width:100%;min-width:0;background:#fff;border:2px solid #e2e2e2;border-radius:12px;padding:6px 10px;font:700 15px/1.3 var(--jp);transition:border-color .15s}
.in:focus{border-color:var(--blue);outline:none}
.in.en{font-family:var(--en)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#fff;border-radius:20px;padding:14px 16px;margin:0 0 12px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.card.hl{background:var(--hl);box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 16px;font:700 14px/1.2 var(--jp);color:#fff;background:var(--gray);transition:transform .15s,filter .15s}
.pill:hover{filter:brightness(1.08);transform:translateY(-1px)}
.pill:active{transform:scale(.96)}
.pill.b{background:var(--blue)}.pill.g{background:var(--green)}.pill.o{background:var(--orange)}.pill.r{background:var(--red)}.pill.k{background:#000}
.pill.ghost{background:#e6e6e6;color:#444}
.pill:disabled{opacity:.5;pointer-events:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.tabs button{border-radius:999px;padding:7px 16px;font:700 15px/1.2 var(--jp);background:#e8e8e8;color:#555;transition:background .2s,color .2s}
.tabs button.on{background:#000;color:#fff}
.sw2{position:relative;width:46px;height:26px;border-radius:13px;background:#d6d6d6;flex:none;transition:background .2s}
.sw2::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw2.on{background:var(--green)}.sw2.on::after{transform:translateX(20px)}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.ins{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #ececec}
.ins:last-child{border-bottom:0}
.ins .num{width:34px;height:34px;font-size:15px}
.ins .bd{flex:1;min-width:0;font:500 14px/1.6 var(--jp)}
.ins .bd b{font-weight:700}
.warn{color:var(--red)}
.good{color:#4fb82a}
.mono{font:600 13px/1.4 var(--en);letter-spacing:.02em}
.cpy{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #e8e8e8;border-radius:12px;padding:6px 6px 6px 12px}
.cpy code{flex:1;min-width:0;overflow:auto;white-space:nowrap;font:600 14px/1.4 var(--en)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi div{background:#fff;border-radius:18px;padding:12px 14px}
.kpi small{display:block;font:700 11.5px/1.3 var(--jp);color:var(--sub)}
.kpi b{display:block;font:700 28px/1.2 var(--en)}
table.t{width:100%;border-collapse:collapse;font:500 13px/1.45 var(--jp)}
table.t th{font:700 11px/1.3 var(--jp);color:var(--sub);text-align:left;padding:4px 6px;white-space:nowrap}
table.t td{border-top:1px solid #ececec;padding:6px;vertical-align:top}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.hsc{overflow:auto;border-radius:16px;background:#fff}
#dia{display:block}
.mx{border-collapse:separate;border-spacing:3px;font:700 12px/1.2 var(--jp)}
.mx th{white-space:nowrap;padding:2px 4px;text-align:left;cursor:pointer}
.mx td.c2{cursor:pointer;padding:2px;text-align:center}
.mx td.c2 i{display:block;width:24px;height:24px;margin:0 auto;border-radius:50%;background:#e9e9e9;transition:background .12s}
.mx td.c2.on i{background:var(--c)}
.mx th[data-tyc]{writing-mode:vertical-rl;text-orientation:upright;max-height:110px;vertical-align:bottom;padding:4px 2px;letter-spacing:-.04em}
.mx td.na{background:transparent;cursor:default}
.sp-line{height:150px}
.tag{display:inline-block;font:700 11px/1.6 var(--jp);border-radius:999px;padding:0 9px;vertical-align:2px;color:#fff}
.tag.mtr{background:var(--line)}.tag.real{background:#0489e1}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#000;color:#fff;border-radius:999px;padding:10px 22px;font:700 14px/1.3 var(--jp);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.seg{display:inline-flex;background:#e8e8e8;border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border-radius:999px;padding:5px 12px;font:700 13px/1.2 var(--en);color:#555;transition:background .2s,color .2s}
.seg button.on{background:var(--green);color:#fff}
.mklist{display:flex;gap:8px;flex-wrap:wrap}
.mklist button{padding:4px;border-radius:14px;border:2px solid transparent;transition:border-color .15s}
.mklist button.on{border-color:#000}
.cols{display:flex;gap:6px;flex-wrap:wrap}
.cols button{width:28px;height:28px;border-radius:50%;transition:transform .15s,box-shadow .15s}
.cols button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px #000}
.cols input[type=color]{width:28px;height:28px;border:0;padding:0;border-radius:50%;overflow:hidden;background:none}
.dd{position:relative;display:inline-block}
.ddm{position:absolute;z-index:20;top:100%;left:0;margin-top:4px;background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:6px;min-width:170px;animation:vin .15s ease}
.ddm button{display:flex;width:100%;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;font:700 14px/1.2 var(--jp);text-align:left}
.ddm button:hover{background:#f1f1f1}
.leg{border-left:4px solid #ddd;padding-left:10px;margin:6px 0}
.spark{display:block;width:100%;height:90px;background:#fff;border-radius:14px}
.ztr{display:flex;align-items:center;gap:6px;font:700 12px var(--jp);color:var(--sub);margin:3px 0}
.ztr input{width:70px}
details.dt>summary{cursor:pointer;font:700 14px/1.4 var(--jp);color:#444;list-style:none;padding:6px 0}
details.dt>summary::before{content:"＋ ";color:#999}
details.dt[open]>summary::before{content:"－ "}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.noanim *{animation:none!important;transition:none!important}
@media (max-width:860px){
  #app{grid-template-rows:auto minmax(0,1fr) minmax(0,46%);grid-template-columns:minmax(0,1fr)}
  #hd{grid-column:1;flex-wrap:wrap;height:auto;row-gap:4px;padding-bottom:6px}
  #lp{grid-row:2}#rp{grid-row:3;grid-column:1;border-radius:24px 24px 0 0}
  .hline{width:100%;height:96px}.legend{display:none}.hname b{font-size:21px}.hname small{font-size:12px}
  .gearb{left:auto;right:70px}.hline .sw{width:calc(100% - 140px)}
  .menu{position:absolute;right:10px;top:8px;margin:0}.menu .c{width:50px;height:50px}
  .hctl{margin:2px 0 0 8px!important;gap:8px}.cb{width:50px}.cb .c{width:46px;height:46px}.cb .c svg{transform:scale(.8)}
  .clock{margin:4px 0 0 10px}.clock b{font-size:28px;margin-top:4px}
  .stat{margin:4px 0 0 10px}
  #bigdia{grid-row:2/4!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="hd">
    <div class="hline">
      <div class="sw">

<script>
'use strict';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let uid = 1;

const CFG0 = {
  acc: 14.4, dec: 14.4, bl: 100, tl: 120, mp: 10, mg: 5, cap: 0, base: '05:00:00', lastT: '23:00:00', win: 0,
  auto: true, anim: true, simT: '15:00:00', speed: 1, fleetw: 30, tnopt: true, tnmin: 30, tnmax: 150, tnstep: 10,

  mode: 'mtr', slack: 3, hold: true, dwr: 20,

  xauto: true, xmax: 120, xmin: 0,
  // 列車間隔: 再計算で駅ごとの発車間隔のばらつきをどれだけ重く見るか（0=見ない）、待避で残す余裕、間隔調整のための待避の延長
  regw: 1, ovm: 30, hadj: true,
  wfrom: '', wto: '', stime: 20
};
const S = { v: 6, name: '', lines: [], st: [], ed: [], ty: [], cn: [], cur: 0, days: [], day: null, cfg: { ...CFG0 } };
const DAYS0 = ['平日', '土曜', '日祝'];
function ensureDays() { if (!S.days || !S.days.length) S.days = DAYS0.map(n => ({ id: nid(), n })); if (!S.days.some(d => d.id === S.day)) S.day = S.days[0].id }
const dayOf = id => (S.days || []).find(d => d.id === id);
const opOnDay = op => !op.days || !op.days.length || op.days.includes(S.day);
const C = () => S.cfg;
const REAL = () => S.cfg.mode === 'real';
let GM = new Map, EMAP = new Map, TYM = new Map, LNM = new Map, PFM = new Map, VPF = new Map, ADJ = null;

function touch() {

  S.ed.forEach(e => { if (!e.id) e.id = nid(); put(e.a + '|' + e.b, e); put(e.b + '|' + e.a, e) });
  TYM = new Map(S.ty.map(t => [t.id, t]));
  LNM = new Map(S.lines.map(l => [l.id, l]));
  PFM = new Map; S.st.forEach(s => (s.pf || []).forEach(p => { p.sid = s.id; PFM.set(p.id, p) }));
  VPF.forEach(p => PFM.set(p.id, p));

}
const stn = id => GM.get(id) || { id, n: '?', en: '', pf: [], num: {} };
// 区間（線路）。路線を「独立した線路」にすると、同じ2駅の間に路線ごとの別の線路を持てる（副都心線と有楽町線など）
function edgeOf(a, b, ln) { const l = EMAP.get(a + '|' + b); if (!l) return undefined; if (ln != null) { const e = l.find(e => e.ln === ln); if (e) return e } return l.find(e => !e.ln) || l[0] }
const lineEdgeExact = (a, b, L) => (EMAP.get(a + '|' + b) || []).find(e => L.own ? e.ln === L.id : !e.ln);
const lineEdge = (L, i) => { const a = L.ids[i], b = L.ids[i + 1]; return lineEdgeExact(a, b, L) || edgeOf(a, b, L.own ? L.id : null) };
const lineEdgeAB = (L, a, b) => lineEdgeExact(a, b, L) || edgeOf(a, b, L.own ? L.id : null);
function mkEdge(a, b, L, d, v, q, z) { const e = { id: nid(), a, b, d: d || 1000, v: v || 120, q: q ? 1 : 0, z: z || [] }; if (L && L.own) e.ln = L.id; S.ed.push(e); return e }
const curLine = () => S.lines[S.cur] || S.lines[0];
const tyOf = id => TYM.get(id) || { id, n: '?', c: '#999', lane: 'L', stops: new Set };
const tyIdx = t => Math.max(0, S.ty.indexOf(t));
const allOps = () => { const o = []; S.st.forEach(s => s.dep && s.dep.ops.forEach(op => { if (opOnDay(op)) o.push({ op, s }) })); return o };
const allOpsAnyDay = () => { const o = []; S.st.forEach(s => s.dep && s.dep.ops.forEach(op => o.push({ op, s }))); return o };

// ---- 時刻
const pt = t => { const m = /^\s*(\d+):(\d{1,2})(?::(\d{1,2}(?:\.\d+)?))?\s*$/.exec(t || ''); return m ? +m[1] * 3600 + +m[2] * 60 + +(m[3] || 0) : NaN };
const hms = s => { s = ((Math.round(s) % 86400) + 86400) % 86400; return [s / 3600 | 0, (s / 60 | 0) % 60, s % 60].map(v => String(v).padStart(2, '0')).join(':') };
const hm = s => hms(s).slice(0, 5);
const fmtMS = s => { s = Math.round(s); const n = s < 0; s = Math.abs(s); return (n ? '-' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') };

// ---- 駅名（MTRの「日本語|English」と[M-15]表記）
const CODE = /\[([^\]]*)\]|【([^】]*)】/g;
function parseName(raw) {
  raw = String(raw || '').normalize('NFKC').trim();
  const codes = []; let m; const re = new RegExp(CODE.source, 'g');
  while ((m = re.exec(raw))) { const c = (m[1] || m[2] || '').trim(), q = /^([A-Za-z]{1,4})\s*[-‐ ]?\s*(\d{1,3}[A-Za-z]?)$/.exec(c); if (q) codes.push({ code: q[1].toUpperCase(), num: q[2] }) }
  const clean = raw.replace(re, '').trim(), parts = clean.split('|').map(x => x.trim()).filter(Boolean);
  return { n: parts[0] || clean || '駅', en: parts.slice(1).join(' '), codes };
}
const keyOf = n => { const raw = String(n).normalize('NFKC').replace(/\s+/g, ''); return C().strict ? raw : (raw.replace(new RegExp(CODE.source, 'g'), '').split('|')[0] || raw) };
const mkSt = (n, en) => ({ id: nid(), n, en: en || '', k: keyOf(n), num: {}, pf: [], dep: null });

// ---- ネットワーク
function adj() {
  if (ADJ) return ADJ; const m = new Map, add = (a, b, e) => { if (!m.has(a)) m.set(a, []); m.get(a).push([b, e]) };
  S.ed.forEach(e => { add(e.a, e.b, e); add(e.b, e.a, e) }); return ADJ = m;
}
// 最短経路。使う路線（pref）の線路を優先し、ほかの路線の独立した線路は避ける
function sp(a, b, pref) {
  const g = adj(), dist = new Map([[a, 0]]), prev = new Map, done = new Set, cost = e => (e.d || 1) * (e.ln && pref && !pref.has(e.ln) ? 4 : 1);
  while (true) {
    let u = null, best = 1e18; for (const [k, v] of dist) if (!done.has(k) && v < best) { best = v; u = k }
    if (u === null) return null; if (u === b) break; done.add(u);
    for (const [w, e] of g.get(u) || []) { const nd = best + cost(e); if (!(dist.has(w) && dist.get(w) <= nd)) { dist.set(w, nd); prev.set(w, [u, e]) } }
  }
  const ids = [b], es = []; while (ids[0] !== a) { const [u, e] = prev.get(ids[0]); ids.unshift(u); es.unshift(e) } return { ids, es };
}
function legPref(lg) {
  if (lg.ln) return new Set([lg.ln]);
  const w = [lg.from, lg.to, ...(lg.via || [])], both = S.lines.filter(L => w.every(id => L.ids.includes(id)));
  return new Set((both.length ? both : S.lines.filter(L => L.ids.includes(lg.from) || L.ids.includes(lg.to))).map(L => L.id));
}
function legPath(lg) {
  const w = [lg.from, ...(lg.via || []), lg.to]; if (w.some(v => v == null || !GM.has(v))) return null; const ids = [w[0]], es = [], pref = legPref(lg);
  for (let i = 0; i < w.length - 1; i++) { if (w[i] === w[i + 1]) continue; const p = sp(w[i], w[i + 1], pref); if (!p) return null; ids.push(...p.ids.slice(1)); es.push(...p.es) }
  return ids.length > 1 ? { ids, es } : null;
}
// 隣り合う2駅の向き（どの路線の下り/上りか）。独立した線路ならその路線で決める
function pairDir(a, b, e) {
  const tryL = L => { const i = L.ids.indexOf(a); if (i < 0) return null; if (L.ids[i + 1] === b) return { ln: L.id, dir: 'd' }; if (L.ids[i - 1] === b) return { ln: L.id, dir: 'u' }; return null };
  if (e && e.ln && LNM.has(e.ln)) { const r = tryL(LNM.get(e.ln)); if (r) return r }
  for (const L of S.lines) if (!L.own) { const r = tryL(L); if (r) return r }
  for (const L of S.lines) { const r = tryL(L); if (r) return r }
  return { ln: null, dir: 'd' };
}
const degree = id => new Set((adj().get(id) || []).map(x => x[0])).size;
// ある駅から指定方向へ進んだ終点の駅（直通先もたどる）
function walkEnd(sid, dir) {
  let L = S.lines.find(l => l.ids.includes(sid)); if (!L) return sid; let cur = sid, guard = 0;
  while (guard++ < 40) {
    const i = L.ids.indexOf(cur), j = dir === 'd' ? L.ids.length - 1 : 0; cur = L.ids[j];
    const nx = S.lines.find(M => M !== L && (dir === 'd' ? M.ids[0] === cur : M.ids[M.ids.length - 1] === cur));
    if (!nx) break; L = nx;
  }
  return cur;
}
function lineEdgesAt(sid) { const out = []; S.lines.forEach(L => { const i = L.ids.indexOf(sid); if (i < 0) return; if (i > 0) out.push(lineEdge(L, i - 1)); if (i < L.ids.length - 1) out.push(lineEdge(L, i)) }); return out.filter(Boolean) }
// ---- ホームの既定値
function mkPf(n, dir, trk, extra) { return { id: nid(), n: '', dir, trk, ln: null, types: null, dw: 10, turn: 0, tdw: 90, ...(extra || {}) } }
function defaultPlatforms(s) {
  const dest = d => stn(walkEnd(s.id, d)).n, q = lineEdgesAt(s.id).some(e => e.q);
  if (degree(s.id) <= 1) { const d = dest(degree(s.id) ? (S.lines.some(L => L.ids[0] === s.id) ? 'd' : 'u') : 'd'); return [mkPf(d + '方面', 'b', 'M', { turn: 1 }), mkPf(d + '方面', 'b', 'M', { turn: 1 })] }

  if (q) return [mkPf(dn, 'd', 'L'), mkPf(dn, 'd', 'X'), mkPf(up, 'u', 'X'), mkPf(up, 'u', 'L')];

}
function ensurePlatforms() { touch(); S.st.forEach(s => { if (!s.pf || !s.pf.length) s.pf = defaultPlatforms(s) }); touch() }
// 方面は向きから自動で決める（入力したときだけその名前）
function autoName(p) {
  const sid = p.sid; if (sid == null || !GM.has(sid)) return '';
  let d = p.dir; if (d === 'b') d = S.lines.some(L => L.ids[0] === sid) ? 'd' : 'u';
  const e = walkEnd(sid, d); return e === sid ? '' : stn(e).n + '方面';
}
const pfName = p => p.virtual ? p.n : (p.n || autoName(p) || 'ホーム');
const pfLabel = p => p.virtual ? p.n : pfName(p) + '(' + (TRK[p.trk] || '本線') + ')';

// ---- 種別がその駅・方向で使うホーム
const PFC = new Map;
function virtualPf(sid, dir, lane) {
  const k = sid + '|' + dir + '|' + lane; let p = VPF.get(k);
  if (!p) { p = { id: 'v' + k, sid, n: lane === 'X' ? '通過線（ホームなし）' : '未設定のホーム', dir, trk: lane === 'X' ? 'P' : 'M', dw: 10, tdw: 90, turn: 1, types: null, virtual: 1 }; VPF.set(k, p); PFM.set(p.id, p) }
  return p;
}
function resolvePf(sid, dir, ln, ty) {
  const key = sid + '|' + dir + '|' + ln + '|' + ty.id; let p = PFC.get(key); if (p) return p;
  const s = stn(sid), stop = ty.stops.has(sid), c0 = (s.pf || []).filter(p => (p.dir === dir || p.dir === 'b') && (!p.ln || p.ln === ln));
  // 停まる列車は通過線（ホームなし）に入れない。通過する列車は通過線があればそこを通る
  const c = stop ? c0.filter(p => p.trk !== 'P') : c0;
  p = c.find(p => p.types && p.types.includes(ty.id));
  if (!p && !stop) p = c.find(p => p.trk === 'P' && !p.types);
  if (!p) {
    const au = c.filter(p => !p.types && p.trk !== 'P');
    if (au.length) {
      const o = au.filter(p => outerT(p.trk)), i = au.filter(p => !outerT(p.trk)), pk = ty.lane === 'L' ? (o.length ? o : i) : i;
      // 速達線側の種別で、停車線（緩行線）しかない駅は、ホームのない通過線を走る
      if (pk.length) p = pk[tyIdx(ty) % pk.length];
      else if (!c.some(p => p.types)) return PFC.set(key, p = virtualPf(sid, dir, 'X')), p;
    }
  }
  if (!p) p = virtualPf(sid, dir, c.length ? 'X' : 'M');
  PFC.set(key, p); return p;
}
// あるホームを使う種別（停車/通過）を全運用から集める
function pfUsers(pid) {
  const out = new Map; if (typeof RT === 'undefined' || !RT) return out;
  RT.forEach(r => r.pf.forEach((p, k) => { if (p.id !== pid) return; const stop = r.stopK.has(k); const o = out.get(r.ty.id) || { ty: r.ty, stop: false, pass: false, turn: false }; if (k === 0 || k === r.ids.length - 1) o.turn = true; if (stop) o.stop = true; else o.pass = true; out.set(r.ty.id, o) }));
  return out;
}

// ---- 路線記号とナンバリング
function mark(L, num, size, opt) {
  opt = opt || {}; size = size || 88; const c = L ? L.c : '#999', code = L ? L.code : '?', mk = (L && L.mk) || 'ring';
  const br = mk === 'sqr' || mk === 'fill' ? Math.round(size * .14) + 'px' : '50%', fillBg = mk === 'fill' || mk === 'dot';
  const bw = Math.max(2, Math.round(size * .115)), fs1 = num != null ? size * .27 : size * (code.length > 2 ? .3 : code.length > 1 ? .4 : .5), fs2 = size * .3;
  const st = `width:${size}px;height:${size}px;border-radius:${br};${fillBg ? `background:${c};color:#fff;` : `background:#fff;border:${bw}px solid ${c};color:#000;`}`;
  const tag = opt.btn ? 'button' : 'span', at = opt.btn ? ` data-ln="${L ? L.id : ''}" title="${esc(L ? L.n : '')}"` : '';

  const a = $('tvk'), b = $('tvr'), c = $('tvs'); if (a) a.innerHTML = trainKpi(tr); if (b) b.innerHTML = injHTML(); if (c) c.innerHTML = trainStops(tr); drawSpark();
}
function drawSpark() {
  const cv = $('spark'); if (!cv || !SIMW) return; const g = cv.getContext('2d'), W2 = cv.width, H2 = cv.height; g.clearRect(0, 0, W2, H2);
  const I = SIMW.inj, t1 = SIMW.t, t0 = I ? Math.min(I.t - 120, t1 - 600) : t1 - 1800, pts = SIMW.series.filter(p => p.t >= t0);
  const mx = Math.max(C().recov * 2, 60, ...pts.map(p => p.mx)), X = t => 20 + (W2 - 40) * (t - t0) / Math.max(1, t1 - t0), Y = v => H2 - 22 - (H2 - 44) * v / mx;
  g.strokeStyle = '#ececec'; g.lineWidth = 2; g.beginPath(); g.moveTo(20, Y(0)); g.lineTo(W2 - 20, Y(0)); g.stroke();
  g.setLineDash([8, 6]); g.strokeStyle = '#7ed957'; g.beginPath(); g.moveTo(20, Y(C().recov)); g.lineTo(W2 - 20, Y(C().recov)); g.stroke(); g.setLineDash([]);
  if (I) { g.strokeStyle = '#ffbd59'; g.lineWidth = 3; g.beginPath(); g.moveTo(X(I.t), 10); g.lineTo(X(I.t), H2 - 22); g.stroke(); if (I.rec) { g.strokeStyle = '#7ed957'; g.beginPath(); g.moveTo(X(I.rec), 10); g.lineTo(X(I.rec), H2 - 22); g.stroke() } }
  if (pts.length > 1) { g.strokeStyle = '#ff5757'; g.lineWidth = 4; g.lineJoin = 'round'; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(X(p.t), Y(p.mx)) : g.moveTo(X(p.t), Y(p.mx))); g.stroke() }
  g.fillStyle = '#8a8a8a'; g.font = '700 20px Jost,sans-serif'; g.fillText(Math.round(mx) + '秒', 24, 26); g.fillText(hm(t0), 20, H2 - 2); g.textAlign = 'right'; g.fillText(hm(t1), W2 - 20, H2 - 2); g.textAlign = 'left';
}
